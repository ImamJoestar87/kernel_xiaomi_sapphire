name: Build Kernel Sapphiren

on:
  workflow_dispatch: 

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libncurses-dev libssl-dev libxml2-utils lzop python3 device-tree-compiler zip unzip wget

      - name: Download ZyC Clang
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget -q $(curl -s https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt)
          tar -zxf Clang-*.tar.gz
          rm -f Clang-*.tar.gz

      - name: Compile Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # GANTI 'sapphiren_defconfig' SESUAI NAMA DEFCONFIG DI REPO KAMU
          DEFCONFIG="generic_bengal_defconfig"
          
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Pack with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          
          # Otomatis konfigurasi anykernel.sh untuk sapphiren
          sed -i 's/do.devicecheck=1/do.devicecheck=1/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=sapphire/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=sapphiren/g' anykernel.sh
          sed -i 's/device.name3=toroplus/device.name3=/g' anykernel.sh
          sed -i 's/device.name4=tuna/device.name4=/g' anykernel.sh
          sed -i 's/device.name5=/device.name5=/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=boot;|g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=1;/g' anykernel.sh
          
          cp ../out/arch/arm64/boot/Image.gz .
          if [ -f "../out/arch/arm64/boot/dtbo.img" ]; then
            cp ../out/arch/arm64/boot/dtbo.img .
          fi
          if ls ../out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1> /dev/null 2>&1; then
            cat ../out/arch/arm64/boot/dts/vendor/qcom/*.dtb > dtb
          fi
         
          zip -r9 ../Kernel-Sapphiren.zip * -x .git README.md *placeholder

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Sapphiren-Flashable
          path: Kernel-Sapphiren.zip
          
